name: 📊 대시보드 자동 업데이트

on:
  push:
    paths:
      - 'data/**'          # data/ 폴더에 엑셀 파일 올릴 때만 실행
  workflow_dispatch:       # 수동 실행 버튼도 제공

jobs:
  build-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 패키지 설치
        run: |
          pip install pandas openpyxl numpy

      - name: 🔄 대시보드 HTML 생성
        run: python parse_dashboard.py

      - name: 📤 index.html 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "📊 대시보드 자동 업데이트 $(date +'%Y-%m-%d %H:%M')"
          git push
